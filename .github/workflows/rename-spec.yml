name: Rename specification file
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rename-spec.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename BYN-SYNC-SPECIFICATION → BIN-SYNC-SPECIFICATION
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Drop placeholder if present (short file)
          if [[ -f BIN-SYNC-SPECIFICATION.txt ]]; then
            sz=$(wc -c < BIN-SYNC-SPECIFICATION.txt)
            if [[ "$sz" -lt 10000 ]]; then
              git rm -f BIN-SYNC-SPECIFICATION.txt || rm -f BIN-SYNC-SPECIFICATION.txt
            fi
          fi

          if [[ -f BYN-SYNC-SPECIFICATION.txt ]]; then
            if [[ -f BIN-SYNC-SPECIFICATION.txt ]]; then
              # Both exist: keep full BYN content under BIN name
              cp BYN-SYNC-SPECIFICATION.txt BIN-SYNC-SPECIFICATION.txt
              git add BIN-SYNC-SPECIFICATION.txt
              git rm -f BYN-SYNC-SPECIFICATION.txt
            else
              git mv BYN-SYNC-SPECIFICATION.txt BIN-SYNC-SPECIFICATION.txt
            fi
          fi

          # Content check: must already say BIN-SYNC (no BYN-SYNC inside)
          if grep -q 'BYN-SYNC' BIN-SYNC-SPECIFICATION.txt 2>/dev/null; then
            sed -i 's/BYN-SYNC/BIN-SYNC/g' BIN-SYNC-SPECIFICATION.txt
            git add BIN-SYNC-SPECIFICATION.txt
          fi

          for f in README.md docs/PRODUCTION-STATUS.md docs/PUBLIC-API.md docs/NAME.md docs/CHANGELOG.md BIN-SYNC-v2.3.7-ADDENDUM.txt LICENSE.md; do
            [[ -f "$f" ]] || continue
            sed -i 's/BYN-SYNC-SPECIFICATION\.txt/BIN-SYNC-SPECIFICATION.txt/g' "$f"
            sed -i 's/BYN-SYNC-SPECIFICATION/BIN-SYNC-SPECIFICATION/g' "$f"
            sed -i 's|smersh1307n2/BYN-SYNC|smersh1307n2/BIN-SYNC|g' "$f"
            # Drop obsolete "until you rename the repository" blurb if still present
            sed -i '/Clone URL may still use/d' "$f" || true
            sed -i '/legacy filename/d' "$f" || true
          done

          # README table: point at canonical name
          if [[ -f README.md ]]; then
            sed -i 's|\[`BYN-SYNC-SPECIFICATION.txt`\](BYN-SYNC-SPECIFICATION.txt)|[`BIN-SYNC-SPECIFICATION.txt`](BIN-SYNC-SPECIFICATION.txt)|g' README.md || true
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "branding: BIN-SYNC-SPECIFICATION.txt (canonical name; content already BIN-SYNC)"
          git push
