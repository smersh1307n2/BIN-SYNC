name: merge-perf-to-main
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/merge-perf-to-main.yml]
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fast-forward main to perf/hotpath-baseline
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main perf/hotpath-baseline
          git checkout -B main origin/perf/hotpath-baseline
          # Drop this one-shot workflow from the tip we push to main (optional keep history)
          git push origin HEAD:main --force-with-lease || git push origin HEAD:main
          echo "main is now at $(git rev-parse HEAD)"
          # cleanup workflow on perf branch so it does not re-run forever
          git checkout perf/hotpath-baseline
          git pull origin perf/hotpath-baseline || true
          if [ -f .github/workflows/merge-perf-to-main.yml ]; then
            git rm -f .github/workflows/merge-perf-to-main.yml
            git commit -m "ci: cleanup merge-perf-to-main" || true
            git push origin HEAD:perf/hotpath-baseline || true
          fi
