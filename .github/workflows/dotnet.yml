name: BinSync.Net

on:
  push:
    branches: ["**"]
    paths:
      - "BinSync.Net/**"
      - ".github/workflows/dotnet.yml"
  pull_request:
    paths:
      - "BinSync.Net/**"
      - ".github/workflows/dotnet.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test
        working-directory: BinSync.Net
        run: dotnet test BinSync.slnx --configuration Release --verbosity minimal
