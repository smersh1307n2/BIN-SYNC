name: BinSync.Net

on:
  push:
    branches: ["**"]
    paths:
      - "BinSync.Net/**"
      - "samples/**"
      - ".github/workflows/dotnet.yml"
      - "docs/PRODUCTION-STATUS.md"
      - "docs/BIN-SYNC-ROADMAP-v3.md"
      - "scripts/vendor-ed25519-from-ztsharp.sh"
      - "third_party/ed25519-zlib/**"
  pull_request:
    paths:
      - "BinSync.Net/**"
      - "samples/**"
      - ".github/workflows/dotnet.yml"
      - "scripts/vendor-ed25519-from-ztsharp.sh"
  workflow_dispatch:
  schedule:
    # Nightly longer fuzz pass (UTC)
    - cron: "17 3 * * *"

concurrency:
  group: binsync-net-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Vendor Ed25519 from ZtSharp (MIT subset)
        shell: bash
        run: bash scripts/vendor-ed25519-from-ztsharp.sh

      - name: Restore
        working-directory: BinSync.Net
        run: dotnet restore BinSync.slnx

      - name: Build
        working-directory: BinSync.Net
        run: dotnet build BinSync.slnx --configuration Release --no-restore

      - name: Build performance benchmarks
        working-directory: BinSync.Net
        run: dotnet build bench/BinSync.Bench/BinSync.Bench.csproj --configuration Release

      - name: Test
        working-directory: BinSync.Net
        run: >
          dotnet test BinSync.slnx
          --configuration Release
          --no-build
          --verbosity minimal
          --collect:"XPlat Code Coverage"
          --results-directory "${{ runner.temp }}/test-results"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=test-results.trx"
          --blame-hang-timeout 3m
          --blame-hang-dump-type mini
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Build and run public samples
        run: |
          dotnet run --project samples/TwoNodeLoopback -c Release
          dotnet run --project samples/TwoNodeTcp -c Release
          dotnet run --project samples/ScenarioHarness -c Release
          dotnet run --project samples/V31ControlPlaneVectors -c Release

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          retention-days: 14
          if-no-files-found: ignore




      - name: Coverage threshold (≥50% line)
        if: always()
        run: |
          f=$(find "${{ runner.temp }}/test-results" -name 'coverage.cobertura.xml' 2>/dev/null | head -1 || true)
          if [ -z "$f" ]; then echo "No cobertura — skip"; exit 0; fi
          python3 -c "
          import xml.etree.ElementTree as ET, sys
          root = ET.parse(sys.argv[1]).getroot()
          rate = float(root.attrib.get('line-rate', 0))
          pct = rate * 100.0
          print(f'line-rate={pct:.1f}%')
          raise SystemExit(0 if pct >= 50 else f'Coverage {pct:.1f}% < 50%')
          " "$f"

      - name: Upload coverage (cobertura)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ${{ runner.temp }}/test-results/**/coverage.cobertura.xml
          retention-days: 14
          if-no-files-found: warn

  test-windows:
    name: test (.NET 10, Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Vendor Ed25519 from ZtSharp (MIT subset)
        run: bash scripts/vendor-ed25519-from-ztsharp.sh

      - name: Restore
        working-directory: BinSync.Net
        run: dotnet restore BinSync.slnx

      - name: Build
        working-directory: BinSync.Net
        run: dotnet build BinSync.slnx --configuration Release --no-restore

      - name: Test
        working-directory: BinSync.Net
        run: >
          dotnet test BinSync.slnx
          --configuration Release
          --no-build
          --verbosity minimal
          --logger "console;verbosity=detailed"
          --blame-hang-timeout 3m
          --blame-hang-dump-type mini

  fuzz:
    name: fuzz + lab (§17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Vendor Ed25519 from ZtSharp (MIT subset)
        run: bash scripts/vendor-ed25519-from-ztsharp.sh

      - name: Restore
        working-directory: BinSync.Net
        run: dotnet restore BinSync.slnx

      - name: Build
        working-directory: BinSync.Net
        run: dotnet build BinSync.slnx --configuration Release --no-restore

      - name: Fuzz + LabEdge + LabFuzz + Hardening
        working-directory: BinSync.Net
        env:
          VSTEST_CONNECTION_TIMEOUT: "180"
        run: >
          dotnet test BinSync.slnx
          --configuration Release
          --no-build
          --verbosity normal
          --filter "FullyQualifiedName~FuzzTests|FullyQualifiedName~LabFuzzTests|FullyQualifiedName~LabEdgeTests|FullyQualifiedName~Hardening"
          --logger "trx;LogFileName=fuzz-results.trx"
          --results-directory "${{ runner.temp }}/fuzz-results"

      - name: Upload fuzz results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-results
          path: ${{ runner.temp }}/fuzz-results
          retention-days: 14
          if-no-files-found: ignore

  v31-golden-vectors:
    name: v3.1 signed control-plane golden vectors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Vendor Ed25519 from ZtSharp (MIT subset)
        run: bash scripts/vendor-ed25519-from-ztsharp.sh

      - name: Run v3.1 signed payload/vector conformance sample
        run: dotnet run --project samples/V31ControlPlaneVectors -c Release

  fld-host-integration-build:
    name: FLD cross-repository host adapter build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout BIN-SYNC
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Vendor Ed25519 from ZtSharp (MIT subset)
        run: bash scripts/vendor-ed25519-from-ztsharp.sh

      - name: Checkout public FLD-DB integration branch
        uses: actions/checkout@v4
        with:
          repository: smersh1307n2/FLD-DB
          ref: fix/crash-consistency-outbox
          path: FLD-DB
          persist-credentials: false

      - name: Build cross-repository FLD host adapter
        shell: bash
        run: |
          dotnet build samples/FldBinSyncHost/FldBinSyncHost.csproj --configuration Release \
            -p:Fld1RepositoryRoot="${{ github.workspace }}/FLD-DB" \
            -p:Fld1DatabaseProject="${{ github.workspace }}/FLD-DB/src/Fld1.Database/Fld1.Database.csproj" \
            -p:Fld1StorageProject="${{ github.workspace }}/FLD-DB/src/Fld1.Storage/Fld1.Storage.csproj"

      - name: Test FLD Core, Storage, Manifest, Run, WAL and Engine durability contracts
        shell: bash
        run: |
          dotnet test FLD-DB/tests/Fld1.Core.Tests/Fld1.Core.Tests.csproj --configuration Release
          dotnet test FLD-DB/tests/Fld1.Storage.Tests/Fld1.Storage.Tests.csproj --configuration Release
          dotnet test FLD-DB/tests/Fld1.Manifest.Tests/Fld1.Manifest.Tests.csproj --configuration Release
          dotnet test FLD-DB/tests/Fld1.Run.Tests/Fld1.Run.Tests.csproj --configuration Release
          dotnet test FLD-DB/tests/Fld1.Wal.Tests/Fld1.Wal.Tests.csproj --configuration Release
          dotnet test FLD-DB/tests/Fld1.Engine.Tests/Fld1.Engine.Tests.csproj --configuration Release

      - name: Test FLD host adapter against durable FLD database
        shell: bash
        run: |
          dotnet test samples/FldBinSyncHost.Tests/FldBinSyncHost.Tests.csproj --configuration Release \
            -p:Fld1RepositoryRoot="${{ github.workspace }}/FLD-DB" \
            -p:Fld1DatabaseProject="${{ github.workspace }}/FLD-DB/src/Fld1.Database/Fld1.Database.csproj" \
            -p:Fld1StorageProject="${{ github.workspace }}/FLD-DB/src/Fld1.Storage/Fld1.Storage.csproj"
