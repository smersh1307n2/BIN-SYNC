name: BinSync.Net

on:
  push:
    branches: ["**"]
    paths:
      - "BinSync.Net/**"
      - ".github/workflows/dotnet.yml"
      - "docs/PRODUCTION-STATUS.md"
  pull_request:
    paths:
      - "BinSync.Net/**"
      - ".github/workflows/dotnet.yml"
  workflow_dispatch:

concurrency:
  group: binsync-net-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: BinSync.Net
        run: dotnet restore BinSync.slnx

      - name: Build
        working-directory: BinSync.Net
        run: dotnet build BinSync.slnx --configuration Release --no-restore

      - name: Test
        working-directory: BinSync.Net
        run: >
          dotnet test BinSync.slnx
          --configuration Release
          --no-build
          --verbosity minimal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "${{ runner.temp }}/test-results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          retention-days: 14
          if-no-files-found: ignore
