name: apply-decode-perf
on:
  push:
    paths: [scripts/patches/decode-batch-inplace.patch, .github/workflows/apply-decode-perf.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/hotpath-baseline
      - name: Apply patch
        run: |
          set -euo pipefail
          git apply --whitespace=nowarn scripts/patches/decode-batch-inplace.patch || {
            echo "trying 3-way / already applied"
            git apply --3way scripts/patches/decode-batch-inplace.patch || true
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BinSync.Net/src/BinSync.Core/Node.cs
          if ! git diff --cached --quiet; then
            git commit -m "perf(decode): in-place DecodeBatchPayload, pre-sized DecodeRecordsArray"
            git push origin HEAD:perf/hotpath-baseline
          fi
          git rm -f .github/workflows/apply-decode-perf.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "ci: cleanup apply-decode-perf" || true
            git push origin HEAD:perf/hotpath-baseline || true
          fi
