name: apply-node-cs8603
on:
  push:
    paths: [scripts/patches/node-cs8603.patch, .github/workflows/apply-node-cs8603.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: |
          set -euo pipefail
          git apply --whitespace=nowarn scripts/patches/node-cs8603.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BinSync.Net/src/BinSync.Core/Node.cs
          git commit -m "fix(node): null-forgiving ResolveAlias return (CS8603)"
          git push origin HEAD:main
          git rm -f .github/workflows/apply-node-cs8603.yml
          git commit -m "ci: cleanup apply-node-cs8603" || true
          git push origin HEAD:main || true
