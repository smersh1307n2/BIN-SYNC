name: ChangeId GC Stage 1 Canary

on:
  push:
    branches:
      - feature/fld-external-storage
    paths:
      - 'BinSync.Net/src/BinSync.Storage/StorageMetadataStore.cs'
      - 'samples/FldBinSyncHost/**'
      - 'samples/FldBinSyncHost.Tests/**'
      - 'samples/FldBinSyncHost.Runtime/**'
      - 'external/Fld1.Storage'
      - '.github/workflows/changeid-gc-stage1-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: changeid-gc-stage1-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changeid-canary:
    name: ChangeId-only disposable canary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout BIN-SYNC
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Vendor Ed25519 from ZtSharp (MIT subset)
        shell: bash
        run: bash scripts/vendor-ed25519-from-ztsharp.sh

      - name: Resolve exact FLD Storage gitlink SHA
        id: fld-ref
        shell: bash
        run: |
          sha="$(git ls-tree HEAD external/Fld1.Storage | awk '{print $3}')"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact FLD-DB revision used by the Storage submodule
        uses: actions/checkout@v4
        with:
          repository: smersh1307n2/FLD-DB
          ref: ${{ steps.fld-ref.outputs.sha }}
          path: FLD-DB
          persist-credentials: false

      - name: Build executable Host and integration tests
        shell: bash
        run: |
          dotnet build samples/FldBinSyncHost.Tests/FldBinSyncHost.Tests.csproj --configuration Release \
            -p:Fld1RepositoryRoot="${{ github.workspace }}/FLD-DB" \
            -p:Fld1DatabaseProject="${{ github.workspace }}/FLD-DB/src/Fld1.Database/Fld1.Database.csproj" \
            -p:Fld1StorageProject="${{ github.workspace }}/FLD-DB/src/Fld1.Storage/Fld1.Storage.csproj"

      - name: Verify ChangeId-only live-reference, cancellation, durable lease and reclaim
        shell: bash
        run: |
          dotnet test samples/FldBinSyncHost.Tests/FldBinSyncHost.Tests.csproj --configuration Release --no-build --no-restore \
            -p:Fld1RepositoryRoot="${{ github.workspace }}/FLD-DB" \
            -p:Fld1DatabaseProject="${{ github.workspace }}/FLD-DB/src/Fld1.Database/Fld1.Database.csproj" \
            -p:Fld1StorageProject="${{ github.workspace }}/FLD-DB/src/Fld1.Storage/Fld1.Storage.csproj" \
            --filter "FullyQualifiedName~Async_host_adapter_changeid_only_canary_preserves_live_relay_reference_then_reclaims" \
            --logger "console;verbosity=normal" \
            --blame-hang-timeout 3m

      - name: Verify ChangeId-only policy restore and durable stop
        shell: bash
        run: |
          dotnet test samples/FldBinSyncHost.Tests/FldBinSyncHost.Tests.csproj --configuration Release --no-build --no-restore \
            -p:Fld1RepositoryRoot="${{ github.workspace }}/FLD-DB" \
            -p:Fld1DatabaseProject="${{ github.workspace }}/FLD-DB/src/Fld1.Database/Fld1.Database.csproj" \
            -p:Fld1StorageProject="${{ github.workspace }}/FLD-DB/src/Fld1.Storage/Fld1.Storage.csproj" \
            --filter "FullyQualifiedName~Production_composition_restores_changeid_only_policy_and_durable_stop_survives_restart" \
            --logger "console;verbosity=normal" \
            --blame-hang-timeout 3m

      - name: Verify real FLD IPC canary at 1k candidates (page limit 4096)
        shell: bash
        run: |
          dotnet test samples/FldBinSyncHost.Tests/FldBinSyncHost.Tests.csproj --configuration Release --no-build --no-restore \
            -p:Fld1RepositoryRoot="${{ github.workspace }}/FLD-DB" \
            -p:Fld1DatabaseProject="${{ github.workspace }}/FLD-DB/src/Fld1.Database/Fld1.Database.csproj" \
            -p:Fld1StorageProject="${{ github.workspace }}/FLD-DB/src/Fld1.Storage/Fld1.Storage.csproj" \
            --filter "FullyQualifiedName~Async_host_adapter_signed_changeid_gc_scale_uses_real_fld_ipc_reference_scan&DisplayName~candidateCount: 1000,&DisplayName~gcPageLimit: 4096" \
            --logger "console;verbosity=normal" \
            --blame-hang-timeout 3m
