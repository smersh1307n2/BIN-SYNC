name: apply-full-bundle
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/payloads/**
      - .github/workflows/apply-full-bundle.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Assemble and extract
        run: |
          set -euo pipefail
          test -f scripts/payloads/p00.b64
          test -f scripts/payloads/p01.b64
          test -f scripts/payloads/p02.b64
          test -f scripts/payloads/p03.b64
          test -f scripts/payloads/p04.b64
          cat scripts/payloads/p00.b64 scripts/payloads/p01.b64 scripts/payloads/p02.b64 scripts/payloads/p03.b64 scripts/payloads/p04.b64 > /tmp/all.b64
          base64 -d /tmp/all.b64 > /tmp/bundle.tgz
          tar xzf /tmp/bundle.tgz
          wc -c BinSync.Net/src/BinSync.Core/Node.cs
          rg -n "AliasToNode =" BinSync.Net/src/BinSync.Core/Node.cs | head -1
          rm -rf scripts/payloads
          rm -f .github/workflows/apply-full-bundle.yml .github/workflows/finalize-alias-gates.yml .github/workflows/push-alias-gates.yml .github/workflows/push-alias-gates2.yml
      - name: Test
        run: |
          set -euo pipefail
          bash scripts/vendor-ed25519-from-ztsharp.sh
          cd BinSync.Net && dotnet test tests/BinSync.Tests -c Release --nologo
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "feat(ids): AliasToNode/NodeToAlias on NodeId; domain sub-gates complete"
          git push origin HEAD:main
