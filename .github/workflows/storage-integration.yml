name: FLD Storage Integration

on:
  push:
    branches:
      - "feature/fld-external-storage"
    paths:
      - ".github/workflows/storage-integration.yml"
      - ".gitmodules"
      - "external/FLD-DB"
      - "BinSync.Net/tests/BinSync.Storage.Integration/**"
      - "BinSync.Net/tests/BinSync.MetadataStore.Conformance/**"
      - "BinSync.Net/src/BinSync.Core/**"
  pull_request:
    paths:
      - ".gitmodules"
      - "external/FLD-DB"
      - "BinSync.Net/tests/BinSync.Storage.Integration/**"
      - "BinSync.Net/tests/BinSync.MetadataStore.Conformance/**"
      - "BinSync.Net/src/BinSync.Core/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout BIN-SYNC and pinned FLD-DB Storage source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore BinSync.Net/tests/BinSync.Storage.Integration/BinSync.Storage.Integration.csproj
      - name: Build Release
        run: dotnet build BinSync.Net/tests/BinSync.Storage.Integration/BinSync.Storage.Integration.csproj --configuration Release --no-restore
      - name: Run durable provider conformance
        run: dotnet test BinSync.Net/tests/BinSync.Storage.Integration/BinSync.Storage.Integration.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=storage-integration.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binsync-fld-storage-integration
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
