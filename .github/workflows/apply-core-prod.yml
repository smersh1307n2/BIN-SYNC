name: apply-core-prod
on:
  push:
    paths: [scripts/core-prod.patch]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply production core patch
        run: |
          set -euo pipefail
          git apply scripts/core-prod.patch
          git rm -f scripts/core-prod.patch .github/workflows/apply-core-prod.yml
          rm -f scripts/p*.txt scripts/core-prod.patch.part* 2>/dev/null || true
          git add -u BinSync.Net/src/BinSync.Core scripts || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "perf: shared byte comparers (HashCode.AddBytes), zero-alloc codec/frame"
          git push
