name: apply-core-prod
on:
  push:
    paths: [scripts/core-prod.patch]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -euo pipefail
          git apply scripts/core-prod.patch
          git rm -f scripts/core-prod.patch .github/workflows/apply-core-prod.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BinSync.Net/src/BinSync.Core/Hlc.cs BinSync.Net/src/BinSync.Core/Node.cs BinSync.Net/src/BinSync.Core/Merge.Counters.cs BinSync.Net/src/BinSync.Core/Production/NodePersistence.cs
          git commit -m "perf: shared byte comparers and microsecond HLC wall"
          git push
