name: apply-core-prod
on:
  push:
    paths: [scripts/core-prod.patch]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -euo pipefail
          git apply --check scripts/core-prod.patch
          git apply scripts/core-prod.patch
          git rm -f scripts/core-prod.patch .github/workflows/apply-core-prod.yml 2>/dev/null || true
          git add BinSync.Net/src/BinSync.Core/Node.cs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf(core): Node.cs BA.Instance + HashCode.AddBytes"
          git push
