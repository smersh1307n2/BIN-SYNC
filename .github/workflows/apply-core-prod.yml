name: apply-core-prod
on:
  push:
    paths: [scripts/pparts/3]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit
        run: |
          set -euo pipefail
          cat scripts/pparts/0 scripts/pparts/1 scripts/pparts/2 scripts/pparts/3 > /tmp/p.patch
          git apply --check /tmp/p.patch
          git apply /tmp/p.patch
          git rm -rf scripts/pparts .github/workflows/apply-core-prod.yml 2>/dev/null || true
          git add BinSync.Net/src/BinSync.Core/Node.cs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status
          git commit -m "perf(core): Node.cs shared BA.Instance + HashCode.AddBytes"
          git push
