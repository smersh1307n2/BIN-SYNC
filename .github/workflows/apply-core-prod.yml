name: apply-core-prod
on:
  push:
    paths: [scripts/uh/08.patch]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -euo pipefail
          for f in scripts/uh/*.patch; do git apply --check "$f"; git apply "$f"; done
          git rm -rf scripts/uh .github/workflows/apply-core-prod.yml 2>/dev/null || true
          git add BinSync.Net/src/BinSync.Core/Node.cs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf(core): Node.cs usage sites BA.Instance"
          git push
