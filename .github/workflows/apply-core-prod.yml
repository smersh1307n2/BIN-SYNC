name: apply-core-prod
on:
  push:
    paths: [scripts/core-prod.patch]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit
        run: |
          set -euo pipefail
          if [ ! -f scripts/core-prod.patch ]; then echo "no patch"; exit 0; fi
          git apply --check scripts/core-prod.patch
          git apply scripts/core-prod.patch
          git rm -f scripts/core-prod.patch .github/workflows/apply-core-prod.yml scripts/.prod-core-pending 2>/dev/null || true
          git rm -rf scripts/b64 2>/dev/null || true
          git add -u BinSync.Net/src/BinSync.Core || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "perf(core): shared BA.Instance + HashCode.AddBytes, zero-alloc Codec/Transport"
          git push
