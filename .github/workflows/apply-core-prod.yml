name: apply-core-prod
on:
  push:
    paths: [scripts/cp11.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply production core patch
        run: |
          set -euo pipefail
          cat scripts/cp00.txt scripts/cp01.txt scripts/cp02.txt scripts/cp03.txt scripts/cp04.txt scripts/cp05.txt scripts/cp06.txt scripts/cp07.txt scripts/cp08.txt scripts/cp09.txt scripts/cp10.txt scripts/cp11.txt > scripts/core-prod.patch
          git apply scripts/core-prod.patch
          git rm -f scripts/core-prod.patch scripts/cp*.txt scripts/p*.txt scripts/core-prod.patch.* .github/workflows/apply-core-prod.yml || true
          git add -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status
          git commit -m "perf: shared byte comparers (HashCode.AddBytes), zero-alloc codec/frame"
          git push
