name: apply-encode-perf
on:
  push:
    paths: [scripts/patches/encode-batch-single-pass.patch, .github/workflows/apply-encode-perf.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/hotpath-baseline
      - name: Apply patch
        run: |
          set -euo pipefail
          git apply --whitespace=nowarn scripts/patches/encode-batch-single-pass.patch || \
            git apply --reverse --check scripts/patches/encode-batch-single-pass.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BinSync.Net/src/BinSync.Core/Node.cs
          if git diff --cached --quiet; then
            echo "already applied"
          else
            git commit -m "perf(encode): single-pass EncodeBatchPayload + WriteRecordsArray"
            git push origin HEAD:perf/hotpath-baseline
          fi
          git rm -f .github/workflows/apply-encode-perf.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "ci: cleanup apply-encode-perf" || true
            git push origin HEAD:perf/hotpath-baseline || true
          fi
