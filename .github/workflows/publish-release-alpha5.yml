name: Publish v0.1.0-alpha.5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-release-alpha5.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag
        run: |
          set -euo pipefail
          TAG=v0.1.0-alpha.5
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag exists"
          else
            git tag -a "$TAG" -m "BinSync.Core 0.1.0-alpha.5"
            git push origin "$TAG"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.5
          name: BinSync.Core 0.1.0-alpha.5
          prerelease: true
          generate_release_notes: false
          body: |
            ## BinSync.Core 0.1.0-alpha.5

            **Protocol:** BIN-SYNC CORE
            **Target:** net10.0
            **License:** AGPL-3.0-or-later + commercial (Ed25519 vendored MIT)

            ### Highlights
            - No BouncyCastle.Cryptography NuGet — Ed25519 vendored (MIT)
            - Codec §6, Merge §8 full set, Schema §18, Lab §17
            - Opt-in: E2EE, causal, KEY_ROTATION, TrustStore TOFU/PreShared
            - ~273 tests green on CI

            ### Docs
            - docs/CHANGELOG.md
            - docs/PRODUCTION-STATUS.md
            - BIN-SYNC-SPECIFICATION.txt
            - LICENSE.md

            ### Not in this cut
            - NuGet.org publish (scripts/pack-nupkg.sh)
            - Full X.509 CA path / LTS audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
