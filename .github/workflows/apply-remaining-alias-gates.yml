name: apply-remaining-alias-gates
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/apply-remaining-alias-gates.yml', 'scripts/patches/alias-gates-remaining.patch']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Apply patch
        run: |
          set -euo pipefail
          git apply --verbose scripts/patches/alias-gates-remaining.patch
          git config user.name "smersh1307n2"
          git config user.email "smersh1307n2@users.noreply.github.com"
          git add -A
          git status
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "feat(node): complete AliasToNode→NodeId + domain sub-gates migration

- Node.cs: _lockStorage/_lockOutbox/_lockMeta + EnterAllGates
- Alias maps: Dictionary<NodeId,...> with (NodeId Id, int Epoch)
- NodePersistence + Diag + Hardening updated
- All 277 tests pass locally"
          git push origin main
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Test
        run: |
          cd BinSync.Net
          bash ../scripts/vendor-ed25519-from-ztsharp.sh || true
          dotnet test tests/BinSync.Tests -c Release --nologo
