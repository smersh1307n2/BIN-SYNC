name: BIN-SYNC executable Host lifecycle and TCP data flow

on:
  push:
    branches:
      - feature/fld-external-storage
    paths:
      - 'samples/FldBinSyncHost.Runtime/**'
      - 'samples/FldBinSyncHost.Tests/FldBinSyncRuntimeHostTests.cs'
      - 'samples/FldBinSyncHost.Tests/FldBinSyncHost.Tests.csproj'
      - 'samples/FldBinSyncHost/FldBinSyncAsyncHostComposition.cs'
      - 'samples/FldBinSyncHost/FldBinSyncGcHostOperations.cs'
      - 'samples/FldBinSyncHost/FldDatabaseIpcAsyncDataProvider.cs'
      - 'samples/FldBinSyncHost/FldDatabaseIpcAsyncRemoteBatchApplyStore.cs'
      - 'samples/FldBinSyncHost/StorageFldBinSyncGcOperatorPolicyStore.cs'
      - 'BinSync.Net/src/BinSync.Storage/**'
      - 'external/Fld1.Storage'
      - '.github/workflows/host-runtime-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binsync-host-runtime-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: executable Host lifecycle (.NET 10, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout BIN-SYNC
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve exact FLD Storage gitlink SHA
        id: fld-ref
        shell: bash
        run: |
          sha="$(git ls-tree HEAD external/Fld1.Storage | awk '{print $3}')"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "BIN-SYNC pins FLD Storage at $sha"

      - name: Checkout exact FLD-DB revision used by the Storage submodule
        uses: actions/checkout@v4
        with:
          repository: smersh1307n2/FLD-DB
          ref: ${{ steps.fld-ref.outputs.sha }}
          path: FLD-DB
          persist-credentials: false

      - name: Build executable Host and integration tests
        shell: bash
        run: |
          dotnet build samples/FldBinSyncHost.Tests/FldBinSyncHost.Tests.csproj --configuration Release \
            -p:Fld1RepositoryRoot="${{ github.workspace }}/FLD-DB" \
            -p:Fld1DatabaseProject="${{ github.workspace }}/FLD-DB/src/Fld1.Database/Fld1.Database.csproj" \
            -p:Fld1StorageProject="${{ github.workspace }}/FLD-DB/src/Fld1.Storage/Fld1.Storage.csproj"

      - name: Test two-Host TCP data flow, operator API, restart and backup rollback
        shell: bash
        run: |
          dotnet test samples/FldBinSyncHost.Tests/FldBinSyncHost.Tests.csproj --configuration Release --no-build --no-restore \
            -p:Fld1RepositoryRoot="${{ github.workspace }}/FLD-DB" \
            -p:Fld1DatabaseProject="${{ github.workspace }}/FLD-DB/src/Fld1.Database/Fld1.Database.csproj" \
            -p:Fld1StorageProject="${{ github.workspace }}/FLD-DB/src/Fld1.Storage/Fld1.Storage.csproj" \
            --filter "FullyQualifiedName~FldBinSyncRuntimeHostTests" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=host-runtime-lifecycle.trx" \
            --results-directory "${{ runner.temp }}/host-runtime-lifecycle-results" \
            --blame-hang-timeout 5m \
            --blame-hang-dump-type mini

      - name: Upload lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-runtime-lifecycle-${{ matrix.os }}
          path: ${{ runner.temp }}/host-runtime-lifecycle-results
          retention-days: 14
          if-no-files-found: ignore
