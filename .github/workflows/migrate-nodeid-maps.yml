name: migrate-nodeid-maps
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/migrate-nodeid-maps.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply NodeId map migration
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path

          p = Path('BinSync.Net/src/BinSync.Core/Node.cs')
          t = p.read_text()
          t = t.replace(
              'public readonly Dictionary<byte[], long> StreamAcked = new(BA.Instance);',
              'public readonly Dictionary<NodeId, long> StreamAcked = new();')
          # PeerState.StreamAcked may already be NodeId if previous replace ran
          t = t.replace(
              'public readonly HashSet<byte[]> Quarantined = new(BA.Instance);',
              'public readonly HashSet<NodeId> Quarantined = new();')
          t = t.replace(
              'public Dictionary<byte[], int> DurableAuthors = new(BA.Instance);   // nodeId -> max known epoch',
              'public Dictionary<NodeId, int> DurableAuthors = new();   // nodeId -> max known epoch')
          t = t.replace(
              'public Dictionary<byte[], Node>? PeersByNid = null;',
              'public Dictionary<NodeId, Node>? PeersByNid = null;')
          # PeerState StreamAcked inside class - same pattern if still byte[]
          if 'class PeerState' in t:
              # ensure PeerState.StreamAcked is NodeId
              t = t.replace(
                  'public readonly Dictionary<byte[], long> StreamAcked = new(BA.Instance);',
                  'public readonly Dictionary<NodeId, long> StreamAcked = new();')
          p.write_text(t)

          p = Path('BinSync.Net/src/BinSync.Core/Transport.cs')
          t = p.read_text()
          t = t.replace('a.PeersByNid ??= new(BA.Instance);', 'a.PeersByNid ??= new Dictionary<NodeId, Node>();')
          t = t.replace('b.PeersByNid ??= new(BA.Instance);', 'b.PeersByNid ??= new Dictionary<NodeId, Node>();')
          t = t.replace(
              'var authors = new Dictionary<byte[], (int? Alias, int Epoch)>(BA.Instance)',
              'var authors = new Dictionary<NodeId, (int? Alias, int Epoch)>()')
          t = t.replace(
              'if (nid2.AsSpan().SequenceEqual(a.NodeId)) authors[nid2] = ((int?)aa, ep);\n                else if (nid2.AsSpan().SequenceEqual(b.NodeId)) authors[nid2] = ((int?)ab, ep);',
              'if (nid2 == (NodeId)a.NodeId) authors[nid2] = ((int?)aa, ep);\n                else if (nid2 == (NodeId)b.NodeId) authors[nid2] = ((int?)ab, ep);')
          t = t.replace(
              'var ordered = authors.OrderBy(kv => Convert.ToHexString(kv.Key)).ToList();',
              'var ordered = authors.OrderBy(kv => kv.Key.ToString()).ToList();')
          t = t.replace(
              'var assigned = new Dictionary<byte[], int>(BA.Instance) { [a.NodeId] = aa, [b.NodeId] = ab };',
              'var assigned = new Dictionary<NodeId, int> { [(NodeId)a.NodeId] = aa, [(NodeId)b.NodeId] = ab };')
          t = t.replace(
              'a.RegisterAlias(b.NodeId, alias, kv.Key, ep);\n            b.RegisterAlias(a.NodeId, alias, kv.Key, ep);',
              'a.RegisterAlias(b.NodeId, alias, kv.Key.ToArray(), ep);\n            b.RegisterAlias(a.NodeId, alias, kv.Key.ToArray(), ep);')
          p.write_text(t)

          p = Path('BinSync.Net/src/BinSync.Core/Production/Membership.cs')
          t = p.read_text()
          t = t.replace('if (nid.AsSpan().SequenceEqual(node.NodeId)) continue;', 'if (nid == (NodeId)node.NodeId) continue;')
          t = t.replace('Add(nid, ep, flags);', 'Add(nid.ToArray(), ep, flags);')
          p.write_text(t)

          p = Path('BinSync.Net/src/BinSync.Core/Production/SessionWire.cs')
          t = p.read_text()
          t = t.replace('var authors = new Dictionary<byte[], int>(BA.Instance)', 'var authors = new Dictionary<NodeId, int>()')
          t = t.replace('var assigned = new Dictionary<byte[], int>(BA.Instance)', 'var assigned = new Dictionary<NodeId, int>()')
          t = t.replace('var ordered = authors.OrderBy(kv => Convert.ToHexString(kv.Key)).ToList();', 'var ordered = authors.OrderBy(kv => kv.Key.ToString()).ToList();')
          t = t.replace('local.PeersByNid ??= new(BA.Instance);', 'local.PeersByNid ??= new Dictionary<NodeId, Node>();')
          t = t.replace('remote.PeersByNid ??= new(BA.Instance);', 'remote.PeersByNid ??= new Dictionary<NodeId, Node>();')
          t = t.replace(
              'result.Add(new AliasMapEntry((ushort)assigned[kv.Key], kv.Key, kv.Value));',
              'result.Add(new AliasMapEntry((ushort)assigned[kv.Key], kv.Key.ToArray(), kv.Value));')
          p.write_text(t)

          p = Path('BinSync.Net/src/BinSync.Core/Production/TcpSync.cs')
          t = p.read_text()
          t = t.replace('PeersByNid ??= new(BA.Instance)', 'PeersByNid ??= new Dictionary<NodeId, Node>()')
          t = t.replace('new Dictionary<byte[], int>(BA.Instance)', 'new Dictionary<NodeId, int>()')
          t = t.replace(
              'foreach (var (nid, ep) in local.DurableAuthors)\n            Consider(nid, ep);',
              'foreach (var (nid, ep) in local.DurableAuthors)\n            Consider(nid.ToArray(), ep);')
          p.write_text(t)

          p = Path('BinSync.Net/src/BinSync.Core/Production/GcNotice.cs')
          t = p.read_text()
          t = t.replace('NodeId = Codec.CanonicalB128(nid),', 'NodeId = Codec.CanonicalB128(nid.ToArray()),')
          p.write_text(t)

          p = Path('BinSync.Net/src/BinSync.Core/Production/NodePersistence.cs')
          t = p.read_text()
          t = t.replace('n.PeersByNid ??= new(BA.Instance);', 'n.PeersByNid ??= new Dictionary<NodeId, Node>();')
          t = t.replace(
              'foreach (var (nid, ep) in n.DurableAuthors.OrderBy(k => k.Key, BytesOrd))\n            { w.B128(nid); w.Varint((ulong)ep); }',
              'foreach (var (nid, ep) in n.DurableAuthors.OrderBy(k => k.Key.ToString()))\n            { w.B128(nid.ToArray()); w.Varint((ulong)ep); }')
          t = t.replace(
              'foreach (var (author, seq) in n.StreamAcked.OrderBy(k => k.Key, BytesOrd))',
              'foreach (var (author, seq) in n.StreamAcked.OrderBy(k => k.Key.ToString()))')
          t = t.replace(
              'foreach (var (author, seq) in ps.StreamAcked.OrderBy(k => k.Key, BytesOrd))\n                { w.B128(author); w.U64((ulong)seq); }',
              'foreach (var (author, seq) in ps.StreamAcked.OrderBy(k => k.Key.ToString()))\n                { w.B128(author.ToArray()); w.U64((ulong)seq); }')
          t = t.replace(
              'foreach (var nid in n.Quarantined.OrderBy(k => k, BytesOrd)) w.B128(nid);',
              'foreach (var nid in n.Quarantined.OrderBy(k => k.ToString())) w.B128(nid.ToArray());')
          t = t.replace(
              'var peers = n.PeersByNid is null ? new List<byte[]>() : n.PeersByNid.Keys.ToList();',
              'var peers = n.PeersByNid is null ? new List<NodeId>() : n.PeersByNid.Keys.ToList();')
          t = t.replace(
              'foreach (var p in peers.OrderBy(k => k, BytesOrd)) w.B128(p);',
              'foreach (var p in peers.OrderBy(k => k.ToString())) w.B128(p.ToArray());')
          p.write_text(t)

          p = Path('BinSync.Net/src/BinSync.Core/Loopback.cs')
          t = p.read_text()
          t = t.replace('Dictionary<byte[], Node>', 'Dictionary<NodeId, Node>')
          t = t.replace('new Dictionary<NodeId, Node>(BA.Instance)', 'new Dictionary<NodeId, Node>()')
          p.write_text(t)

          p = Path('BinSync.Net/tests/BinSync.Tests/Helpers.cs')
          t = p.read_text()
          if 'Eq(NodeId a, byte[]' not in t:
              t = t.replace(
                  '''    public static bool Eq(byte[]? a, byte[]? b) =>\n        a is null ? b is null : b is not null && a.AsSpan().SequenceEqual(b);\n\n    public static string Hex(byte[] a) => Convert.ToHexString(a);\n}''',
                  '''    public static bool Eq(byte[]? a, byte[]? b) =>\n        a is null ? b is null : b is not null && a.AsSpan().SequenceEqual(b);\n\n    public static bool Eq(NodeId a, byte[]? b) => Eq(a.ToArray(), b);\n    public static bool Eq(byte[]? a, NodeId b) => Eq(a, b.ToArray());\n    public static bool Eq(NodeId a, NodeId b) => a == b;\n    public static bool Eq(RecordId a, byte[]? b) => Eq(a.ToArray(), b);\n    public static bool Eq(byte[]? a, RecordId b) => Eq(a, b.ToArray());\n\n    public static string Hex(byte[] a) => Convert.ToHexString(a);\n    public static string Hex(NodeId a) => a.ToString();\n}\n''')
          p.write_text(t)

          for rel in ['BinSync.Net/tests/BinSync.Tests/Diag.cs', 'BinSync.Net/tests/BinSync.Tests/Diag2.cs']:
              p = Path(rel)
              if not p.exists(): continue
              t = p.read_text()
              if 'H(NodeId' not in t:
                  t = t.replace(
                      'private static string H(byte[] b) => Convert.ToHexString(b).ToLowerInvariant();',
                      'private static string H(byte[] b) => Convert.ToHexString(b).ToLowerInvariant();\n    private static string H(NodeId n) => n.ToString().ToLowerInvariant();')
              t = t.replace(
                  '(n.PeersByNid?.Keys ?? Enumerable.Empty<byte[]>())',
                  '(n.PeersByNid?.Keys.Select(k => k.ToArray()) ?? Enumerable.Empty<byte[]>())')
              p.write_text(t)

          print('migration applied')
          PY
      - name: Vendor + test
        run: |
          set -euo pipefail
          bash scripts/vendor-ed25519-from-ztsharp.sh
          cd BinSync.Net
          dotnet test tests/BinSync.Tests -c Release --nologo
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/migrate-nodeid-maps.yml || true
          git add -A
          git commit -m "feat(ids): DurableAuthors/Quarantined/PeersByNid/StreamAcked use NodeId"
          git push origin HEAD:main
