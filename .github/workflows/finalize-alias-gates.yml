name: finalize-alias-gates
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/finalize-alias-gates.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Migrate
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path('BinSync.Net/src/BinSync.Core/Node.cs')
          t = p.read_text()
          if '_lockStorage' not in t:
              t = t.replace('    private readonly object _gate = new();',
                  '    private readonly object _lockStorage = new();\n    private readonly object _lockOutbox = new();\n    private readonly object _lockMeta = new();')
              t = t.replace('    public object Gate => _gate;',
                  '    public AllGateScope EnterAllGates() => new AllGateScope(_lockStorage, _lockOutbox, _lockMeta);\n    public object Gate => _lockMeta;')
              for name in 'RegisterSessionEpoch LearnAuthorEpoch ResetSession EnsureAlias RegisterAlias ResolveAlias DurableId AliasOf AuthorEpoch'.split():
                  t = t.replace(f'lock (_gate) return {name}Internal', f'lock (_lockMeta) return {name}Internal')
                  t = t.replace(f'lock (_gate) {name}Internal', f'lock (_lockMeta) {name}Internal')
              for name in 'Ns SeenState RecordDigestOf AllRecordDigests'.split():
                  t = t.replace(f'lock (_gate) return {name}Internal', f'lock (_lockStorage) return {name}Internal')
                  t = t.replace(f'lock (_gate) {name}Internal', f'lock (_lockStorage) {name}Internal')
              for name in 'NextOutboxSeq OutboxSize'.split():
                  t = t.replace(f'lock (_gate) return {name}Internal', f'lock (_lockOutbox) return {name}Internal')
                  t = t.replace(f'lock (_gate) {name}Internal', f'lock (_lockOutbox) {name}Internal')
              for name in 'PushOutbox WriteField TombField DeleteRecord UndeleteRecord'.split():
                  t = t.replace(f'lock (_gate) return {name}Internal', f'lock (_lockStorage) lock (_lockOutbox) return {name}Internal')
                  t = t.replace(f'lock (_gate) {name}Internal', f'lock (_lockStorage) lock (_lockOutbox) {name}Internal')
              for name in 'CreateDeltaBatch EncodeBatchPayload DecodeBatchPayload ApplyBatch ApplyOp ProcessAck BuildSnapshot ApplySnapshot SignBatchFor AdvanceStream'.split():
                  t = t.replace(f'lock (_gate) return {name}Internal', f'lock (_lockStorage) lock (_lockOutbox) lock (_lockMeta) return {name}Internal')
                  t = t.replace(f'lock (_gate) {name}Internal', f'lock (_lockStorage) lock (_lockOutbox) lock (_lockMeta) {name}Internal')
              t = t.replace('cref="_gate"', 'cref="EnterAllGates"')
          t = t.replace(
              'public Dictionary<byte[], Dictionary<int, (byte[], int)>> AliasToNode = new(BA.Instance);',
              'public Dictionary<NodeId, Dictionary<int, (NodeId Id, int Epoch)>> AliasToNode = new();')
          t = t.replace(
              'public Dictionary<byte[], Dictionary<(byte[], int), int>> NodeToAlias = new(BA.Instance);   // BUGFIX (port): inner map keyed by content-equal (nodeId, epoch) pairs — default tuple comparer used byte[] reference equality.',
              'public Dictionary<NodeId, Dictionary<(NodeId Id, int Epoch), int>> NodeToAlias = new();')
          t = t.replace('new Dictionary<int, (byte[], int)>()', 'new Dictionary<int, (NodeId Id, int Epoch)>()')
          t = t.replace('new Dictionary<(byte[], int), int>(BAI2.Instance)', 'new Dictionary<(NodeId Id, int Epoch), int>()')
          t = t.replace('Dictionary<int, (byte[], int)>?', 'Dictionary<int, (NodeId Id, int Epoch)>?')
          t = t.replace('Dictionary<int, (byte[], int)>', 'Dictionary<int, (NodeId Id, int Epoch)>')
          t = t.replace('NodeToAlias[peer] = new(BAI2.Instance)', 'NodeToAlias[peer] = new()')
          t = t.replace('(NodeToAlias[peer] = new(BAI2.Instance))', '(NodeToAlias[peer] = new())')
          t = t.replace('((byte[])null!, int.MinValue)', '(default, int.MinValue)')
          t = t.replace('var durable = (nodeId, epoch);', 'var durable = ((NodeId)nodeId, epoch);')
          for a,b in [
              ('dur.Item1.AsSpan().SequenceEqual(nodeId)', 'dur.Id == (NodeId)nodeId'),
              ('cur.Item1.AsSpan().SequenceEqual(nodeId)', 'cur.Id == (NodeId)nodeId'),
              ('d2.Item1.AsSpan().SequenceEqual(nodeId)', 'd2.Id == (NodeId)nodeId'),
              ('occA.Item1.AsSpan().SequenceEqual(nodeId)', 'occA.Id == (NodeId)nodeId'),
              ('occB.Item1.AsSpan().SequenceEqual(nodeId)', 'occB.Id == (NodeId)nodeId'),
              ('occ.Item1.AsSpan().SequenceEqual(nodeId)', 'occ.Id == (NodeId)nodeId'),
              ('owner.Item1.AsSpan().SequenceEqual(nodeId)', 'owner.Id == (NodeId)nodeId'),
              ('nid.AsSpan().SequenceEqual(author)', 'nid == (NodeId)author'),
              ('nid_.AsSpan().SequenceEqual(e.AuthorNodeId)', 'nid_ == (NodeId)e.AuthorNodeId'),
              ('nid2.AsSpan().SequenceEqual(author)', 'nid2 == (NodeId)author'),
              ('n.AsSpan().SequenceEqual(resolved)', 'n == (NodeId)resolved'),
              ('otherPeerKv.AsSpan().SequenceEqual(senderPeer)', 'otherPeerKv == (NodeId)senderPeer'),
              ('&& !otherPeerKv == (NodeId)senderPeer', '&& !(otherPeerKv == (NodeId)senderPeer)'),
              ('&& !owner.Id == (NodeId)nodeId', '&& !(owner.Id == (NodeId)nodeId)'),
              ('bool have = !(entry.Item1 is null) || entry.Item2 != int.MinValue;', 'bool have = entry.Item2 != int.MinValue;'),
              ('try { RegisterAlias(peer, alias, durThere.Item1, durThere.Item2); return durThere.Item1; } // E-1: bare nodeId',
               'try { RegisterAlias(peer, alias, durThere.Id.ToArray(), durThere.Epoch); return durThere.Id.ToArray(); } // E-1: bare nodeId'),
              ('try { RegisterAlias(peer, alias, durTheir.Item1, durTheir.Item2); return durTheir.Item1; }',
               'try { RegisterAlias(peer, alias, durTheir.Id.ToArray(), durTheir.Epoch); return durTheir.Id.ToArray(); }'),
              ('return entry.Item1 ?? throw new SyncException("UNKNOWN_ALIAS"); // E-1: bare nodeId',
               'return entry.Id.IsZero && entry.Epoch == int.MinValue ? throw new SyncException("UNKNOWN_ALIAS") : entry.Id.ToArray(); // E-1: bare nodeId'),
              ('EnsureAlias(otherPeer, resolved, epm.Value);', 'EnsureAlias(otherPeer, resolved.ToArray(), epm.Value);'),
              ('EnsureAlias(senderNode, resolved, epm.Value);', 'EnsureAlias(senderNode, resolved.ToArray(), epm.Value);'),
          ]:
              t = t.replace(a,b)
          p.write_text(t)
          print('Node ok', 'AliasToNode' in t, t.count('lock (_gate)'))

          for rel in ['Node.Trust.cs','Node.Schema.cs','Node.Causal.cs','Node.E2ee.cs']:
              p = Path('BinSync.Net/src/BinSync.Core/Production')/rel
              if p.exists():
                  p.write_text(p.read_text().replace('lock (_gate)', 'lock (_lockMeta)'))
          p = Path('BinSync.Net/src/BinSync.Core/Production/Node.Republish.cs')
          if p.exists():
              p.write_text(p.read_text().replace('lock (_gate)', 'lock (_lockStorage) lock (_lockOutbox)'))
          p = Path('BinSync.Net/src/BinSync.Core/Production/InternalAccess.cs')
          if p.exists():
              tt = p.read_text().replace('lock (_gate)', 'lock (_lockStorage) lock (_lockOutbox)')
              tt = tt.replace('var store = Ns(namespaceId);', 'var store = NsInternal(namespaceId);')
              p.write_text(tt)
          p = Path('BinSync.Net/src/BinSync.Core/Production/NodePersistence.cs')
          if p.exists():
              tt = p.read_text()
              tt = tt.replace('lock (n.Gate) // point-in-time image under the re-entrant gate', 'using (n.EnterAllGates()) // point-in-time image under all domain gates')
              tt = tt.replace('foreach (var (peer, map) in n.AliasToNode.OrderBy(k => k.Key, BytesOrd))', 'foreach (var (peer, map) in n.AliasToNode.OrderBy(k => k.Key.ToString()))')
              tt = tt.replace('foreach (var (peer, map) in n.NodeToAlias.OrderBy(k => k.Key, BytesOrd))', 'foreach (var (peer, map) in n.NodeToAlias.OrderBy(k => k.Key.ToString()))')
              tt = tt.replace('var map = new Dictionary<int, (byte[], int)>();', 'var map = new Dictionary<int, (NodeId Id, int Epoch)>();')
              tt = tt.replace('map[alias] = (nid, ep);', 'map[alias] = ((NodeId)nid, ep);')
              tt = tt.replace('n.AliasToNode[peer] = map;', 'n.AliasToNode[(NodeId)peer] = map;')
              tt = tt.replace('var map = new Dictionary<(byte[], int), int>(BAI2.Instance);', 'var map = new Dictionary<(NodeId Id, int Epoch), int>();')
              tt = tt.replace('map[(nid, ep)] = alias;', 'map[((NodeId)nid, ep)] = alias;')
              tt = tt.replace('n.NodeToAlias[peer] = map;', 'n.NodeToAlias[(NodeId)peer] = map;')
              p.write_text(tt)
          p = Path('BinSync.Net/src/BinSync.Core/Production/AsyncTransport.cs')
          if p.exists():
              p.write_text(p.read_text().replace('lock (src.Gate)', 'using (src.EnterAllGates())'))
          p = Path('BinSync.Net/tests/BinSync.Tests/Production/Hardening.cs')
          if p.exists():
              p.write_text(p.read_text().replace(
                  'if (!nid.AsSpan().SequenceEqual(onidEp.Item1) || ep != onidEp.Item2) return false;',
                  'if (nid != onidEp.Id || ep != onidEp.Epoch) return false;'))
          print('ALL_OK')
          PY
      - name: Test
        run: |
          set -euo pipefail
          bash scripts/vendor-ed25519-from-ztsharp.sh
          cd BinSync.Net && dotnet test tests/BinSync.Tests -c Release --nologo
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/finalize-alias-gates.yml .github/workflows/push-alias-gates.yml .github/workflows/apply-domain-gates.yml
          git add -A
          git commit -m "feat(ids): AliasToNode/NodeToAlias on NodeId; domain sub-gates complete"
          git push origin HEAD:main
