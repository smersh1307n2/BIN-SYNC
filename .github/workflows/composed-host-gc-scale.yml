name: Composed Host Metadata GC Smoke and Scale

on:
  push:
    branches:
      - feature/fld-external-storage
    paths:
      - 'BinSync.Net/src/BinSync.Storage/AsyncStorageSyncCoordinator.cs'
      - 'BinSync.Net/src/BinSync.Storage/AssemblyInfo.cs'
      - 'BinSync.Net/src/BinSync.Storage/StorageMetadataStore.cs'
      - 'samples/FldBinSyncHost.Tests/FldDatabaseIpcAsyncDataProviderTests.cs'
      - 'external/Fld1.Storage'
      - '.github/workflows/composed-host-gc-scale.yml'
  workflow_dispatch:
  schedule:
    # Weekly scale evidence; not part of every functional CI run (UTC)
    - cron: "13 4 * * 0"

permissions:
  contents: read

concurrency:
  group: composed-host-metadata-gc-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scale:
    name: composed Host GC smoke / scheduled scale (.NET 10, Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout BIN-SYNC
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Vendor Ed25519 from ZtSharp (MIT subset)
        run: bash scripts/vendor-ed25519-from-ztsharp.sh

      - name: Resolve exact FLD Storage gitlink SHA
        id: fld-ref
        shell: bash
        run: |
          sha="$(git ls-tree HEAD external/Fld1.Storage | awk '{print $3}')"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "BIN-SYNC pins FLD Storage at $sha"

      - name: Checkout exact FLD-DB revision used by the Storage submodule
        uses: actions/checkout@v4
        with:
          repository: smersh1307n2/FLD-DB
          ref: ${{ steps.fld-ref.outputs.sha }}
          path: FLD-DB
          persist-credentials: false

      - name: Build Host adapter and its tests
        shell: bash
        run: |
          dotnet build samples/FldBinSyncHost.Tests/FldBinSyncHost.Tests.csproj --configuration Release \
            -p:Fld1RepositoryRoot="${{ github.workspace }}/FLD-DB" \
            -p:Fld1DatabaseProject="${{ github.workspace }}/FLD-DB/src/Fld1.Database/Fld1.Database.csproj" \
            -p:Fld1StorageProject="${{ github.workspace }}/FLD-DB/src/Fld1.Storage/Fld1.Storage.csproj"

      - name: Measure composed Host GC scale in isolation
        shell: bash
        env:
          COMPOSED_HOST_METADATA_GC_SCALE_FILE: ${{ runner.temp }}/composed-host-metadata-gc-scale.md
          GC_SCALE_FULL: ${{ contains(github.event.head_commit.message, '[gc-scale-full]') }}
          GC_SCALE_250K: ${{ contains(github.event.head_commit.message, '[gc-scale-250k]') }}
        run: |
          run_case() {
            local name="$1"
            local filter="$2"
            local hang_timeout="${3:-5m}"
            echo "::group::Isolated GC measurement: $name"
            dotnet test samples/FldBinSyncHost.Tests/FldBinSyncHost.Tests.csproj --configuration Release --no-build --no-restore \
              -p:Fld1RepositoryRoot="${{ github.workspace }}/FLD-DB" \
              -p:Fld1DatabaseProject="${{ github.workspace }}/FLD-DB/src/Fld1.Database/Fld1.Database.csproj" \
              -p:Fld1StorageProject="${{ github.workspace }}/FLD-DB/src/Fld1.Storage/Fld1.Storage.csproj" \
              --filter "$filter" \
              --logger "console;verbosity=normal" \
              --logger "trx;LogFileName=$name.trx" \
              --results-directory "$RUNNER_TEMP/fld-host-gc-scale-test-results/$name" \
              --blame-hang-timeout "$hang_timeout" \
              --blame-hang-dump-type mini
            echo "::endgroup::"
          }

          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GC_SCALE_250K" = "true" ]; then
            # Diagnostic rerun: isolate only the previously stalled 250k Tombstone case.
            expected=1
            run_case "tombstone-250000" \
              "FullyQualifiedName~Async_host_adapter_signed_tombstone_gc_scale&DisplayName~candidateCount: 250000" 15m
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GC_SCALE_FULL" != "true" ]; then
            # Routine CI: one representative Tombstone GC point, in its own test process.
            expected=1
            run_case "tombstone-50000" \
              "FullyQualifiedName~Async_host_adapter_signed_tombstone_gc_scale&DisplayName~candidateCount: 50000"
          else
            # Each cardinality/page-size pair gets a fresh dotnet test process so
            # WorkingSet and PeakWorkingSet cannot inherit earlier theory cases.
            expected=11
            for count in 1000 10000 50000 100000 250000; do
              filter="FullyQualifiedName~Async_host_adapter_signed_tombstone_gc_scale&DisplayName~candidateCount: $count"
              # VSTest '~' is substring matching; exclude longer numeric prefixes.
              if [ "$count" = "1000" ]; then
                filter="$filter&DisplayName!~candidateCount: 10000&DisplayName!~candidateCount: 100000"
              elif [ "$count" = "10000" ]; then
                filter="$filter&DisplayName!~candidateCount: 100000"
              fi
              run_case "tombstone-$count" "$filter"
            done
            run_case "changeid-1000-4096" \
              "FullyQualifiedName~Async_host_adapter_signed_changeid_gc_scale&DisplayName~candidateCount: 1000&DisplayName~gcPageLimit: 4096"
            run_case "changeid-10000-4096" \
              "FullyQualifiedName~Async_host_adapter_signed_changeid_gc_scale&DisplayName~candidateCount: 10000&DisplayName~gcPageLimit: 4096"
            for limit in 4096 256 1024 2048; do
              run_case "changeid-50000-$limit" \
                "FullyQualifiedName~Async_host_adapter_signed_changeid_gc_scale&DisplayName~candidateCount: 50000&DisplayName~gcPageLimit: $limit"
            done
          fi
          echo "Expected measurement cases: $expected"
          echo "$expected" > "$RUNNER_TEMP/expected-gc-measurements.txt"

      - name: Verify and upload composed Host GC scale measurements
        shell: bash
        run: |
          summary="$RUNNER_TEMP/composed-host-metadata-gc-scale.md"
          test -f "$summary"
          expected="$(cat "$RUNNER_TEMP/expected-gc-measurements.txt")"
          count="$(grep -c '^COMPOSED_HOST_' "$summary" || true)"
          if [ "$count" -ne "$expected" ]; then
            echo "::error::Expected $expected isolated Host GC measurements, found $count."
            exit 1
          fi
          cp "$summary" composed-host-metadata-gc-scale.md

      - name: Upload scale diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composed-host-metadata-gc-scale-${{ github.sha }}
          path: |
            composed-host-metadata-gc-scale.md
            ${{ runner.temp }}/fld-host-gc-scale-test-results
          retention-days: 30
          if-no-files-found: error

# Diagnostic marker: keep this workflow eligible for the isolated 250k tombstone rerun.

# Re-run validation against the currently pinned FLD Storage revision.
