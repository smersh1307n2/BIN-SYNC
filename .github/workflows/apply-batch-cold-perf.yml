name: apply-batch-cold-perf
on:
  push:
    paths: [scripts/patches/apply-batch-cold-perf.patch, .github/workflows/apply-batch-cold-perf.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/hotpath-baseline
      - name: Apply patch
        run: |
          set -euo pipefail
          if git apply --check scripts/patches/apply-batch-cold-perf.patch 2>/dev/null; then
            git apply --whitespace=nowarn scripts/patches/apply-batch-cold-perf.patch
          else
            echo "patch already applied or context mismatch"
            git apply --whitespace=nowarn scripts/patches/apply-batch-cold-perf.patch || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BinSync.Net/src/BinSync.Core/Node.cs
          if ! git diff --cached --quiet; then
            git commit -m "perf(apply): decode-once, ComputeRecordsRoot single buffer, O(1) changed flags"
            git push origin HEAD:perf/hotpath-baseline
          fi
          git rm -f .github/workflows/apply-batch-cold-perf.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "ci: cleanup apply-batch-cold-perf" || true
            git push origin HEAD:perf/hotpath-baseline || true
          fi
