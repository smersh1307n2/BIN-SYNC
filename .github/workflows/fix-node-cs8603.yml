name: fix-node-cs8603
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/fix-node-cs8603.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Replace line
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path('BinSync.Net/src/BinSync.Core/Node.cs')
          t = p.read_text()
          old = '        return entry.Item1;   // SPEC CORRECTION (errata E-1): bare nodeId'
          new = '        return entry.Item1 ?? throw new SyncException("UNKNOWN_ALIAS"); // E-1: bare nodeId'
          if old not in t:
              # try fuzzy
              import re
              t2, n = re.subn(r'return entry\.Item1;\s*//.*bare nodeId.*',
                              'return entry.Item1 ?? throw new SyncException("UNKNOWN_ALIAS"); // E-1: bare nodeId',
                              t, count=1)
              if n != 1:
                  raise SystemExit('pattern not found')
              t = t2
          else:
              t = t.replace(old, new, 1)
          p.write_text(t)
          print('patched')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BinSync.Net/src/BinSync.Core/Node.cs
          if ! git diff --cached --quiet; then
            git commit -m "fix(node): null-forgiving ResolveAlias return (CS8603)"
            git push origin HEAD:main
          fi
          git rm -f .github/workflows/fix-node-cs8603.yml .github/workflows/apply-node-cs8603.yml 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "ci: cleanup node CS8603 workflows"
            git push origin HEAD:main
          fi
