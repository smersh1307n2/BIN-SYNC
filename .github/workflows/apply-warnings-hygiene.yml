name: apply-warnings-hygiene
on:
  push:
    paths: [scripts/patches/warnings-hygiene.patch, .github/workflows/apply-warnings-hygiene.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: |
          set -euo pipefail
          git apply --whitespace=nowarn scripts/patches/warnings-hygiene.patch || git apply --3way scripts/patches/warnings-hygiene.patch || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(src): CA2014 out of loop + XML doc hygiene for TreatWarningsAsErrors"
            git push origin HEAD:main
          fi
          git rm -f .github/workflows/apply-warnings-hygiene.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "ci: cleanup apply-warnings-hygiene" || true
            git push origin HEAD:main || true
          fi
