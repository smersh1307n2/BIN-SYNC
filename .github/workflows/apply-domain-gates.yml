name: apply-domain-gates
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/apply-domain-gates.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Transform Node locks
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          import re

          p = Path('BinSync.Net/src/BinSync.Core/Node.cs')
          t = p.read_text()

          m = re.search(
              r'    /// <summary>\n    /// Re-entrant gate serializing ALL public state.*?
    public object Gate => _gate;\n',
              t, re.S)
          new = '''    /// <summary>
    /// Domain sub-gates. Acquisition order: Storage → Outbox → Meta.
    /// Public entry points take only needed domains; multi-domain ops nest in that order.
    /// </summary>
    private readonly object _lockStorage = new();
    private readonly object _lockOutbox = new();
    private readonly object _lockMeta = new();

    /// <summary>Acquire all domain locks (Storage → Outbox → Meta).</summary>
    public AllGateScope EnterAllGates() => new AllGateScope(_lockStorage, _lockOutbox, _lockMeta);

    /// <summary>Legacy gate (Meta only). Prefer <see cref="EnterAllGates"/> for full exclusion.</summary>
    public object Gate => _lockMeta;

'''
          if m:
              t = t[:m.start()] + new + t[m.end():]
          else:
              t = t.replace('    private readonly object _gate = new();',
                  '    private readonly object _lockStorage = new();\n    private readonly object _lockOutbox = new();\n    private readonly object _lockMeta = new();')
              t = t.replace('    public object Gate => _gate;',
                  '    public AllGateScope EnterAllGates() => new AllGateScope(_lockStorage, _lockOutbox, _lockMeta);\n    public object Gate => _lockMeta;')

          META = 'RegisterSessionEpoch LearnAuthorEpoch ResetSession EnsureAlias RegisterAlias ResolveAlias DurableId AliasOf AuthorEpoch'.split()
          STORAGE = 'Ns SeenState RecordDigestOf AllRecordDigests'.split()
          OUTBOX = 'NextOutboxSeq OutboxSize'.split()
          SO = 'PushOutbox WriteField TombField DeleteRecord UndeleteRecord'.split()
          ALL = 'CreateDeltaBatch EncodeBatchPayload DecodeBatchPayload ApplyBatch ApplyOp ProcessAck BuildSnapshot ApplySnapshot SignBatchFor AdvanceStream'.split()

          for name in META:
              t = t.replace(f'lock (_gate) return {name}Internal', f'lock (_lockMeta) return {name}Internal')
              t = t.replace(f'lock (_gate) {name}Internal', f'lock (_lockMeta) {name}Internal')
          for name in STORAGE:
              t = t.replace(f'lock (_gate) return {name}Internal', f'lock (_lockStorage) return {name}Internal')
              t = t.replace(f'lock (_gate) {name}Internal', f'lock (_lockStorage) {name}Internal')
          for name in OUTBOX:
              t = t.replace(f'lock (_gate) return {name}Internal', f'lock (_lockOutbox) return {name}Internal')
              t = t.replace(f'lock (_gate) {name}Internal', f'lock (_lockOutbox) {name}Internal')
          for name in SO:
              t = t.replace(f'lock (_gate) return {name}Internal', f'lock (_lockStorage) lock (_lockOutbox) return {name}Internal')
              t = t.replace(f'lock (_gate) {name}Internal', f'lock (_lockStorage) lock (_lockOutbox) {name}Internal')
          for name in ALL:
              t = t.replace(f'lock (_gate) return {name}Internal', f'lock (_lockStorage) lock (_lockOutbox) lock (_lockMeta) return {name}Internal')
              t = t.replace(f'lock (_gate) {name}Internal', f'lock (_lockStorage) lock (_lockOutbox) lock (_lockMeta) {name}Internal')

          t = t.replace('see <see cref="_gate"/>', 'see domain gates / <see cref="EnterAllGates"/>')
          t = t.replace('cref="_gate"', 'cref="EnterAllGates"')
          p.write_text(t)
          print('Node leftover lock _gate', t.count('lock (_gate)'))

          for rel in ['Node.Trust.cs','Node.Schema.cs','Node.Causal.cs','Node.E2ee.cs']:
              p = Path('BinSync.Net/src/BinSync.Core/Production')/rel
              tt = p.read_text().replace('lock (_gate)', 'lock (_lockMeta)')
              tt = tt.replace('cref="_gate"', 'cref="EnterAllGates"')
              p.write_text(tt)
          p = Path('BinSync.Net/src/BinSync.Core/Production/Node.Republish.cs')
          p.write_text(p.read_text().replace('lock (_gate)', 'lock (_lockStorage) lock (_lockOutbox)'))

          p = Path('BinSync.Net/src/BinSync.Core/Production/InternalAccess.cs')
          tt = p.read_text()
          tt = tt.replace('lock (_gate)', 'lock (_lockStorage) lock (_lockOutbox)')
          tt = tt.replace('var store = Ns(namespaceId);', 'var store = NsInternal(namespaceId);')
          p.write_text(tt)

          p = Path('BinSync.Net/src/BinSync.Core/Production/NodePersistence.cs')
          tt = p.read_text()
          tt = tt.replace(
              'lock (n.Gate) // point-in-time image under the re-entrant gate',
              'using (n.EnterAllGates()) // point-in-time image under all domain gates')
          p.write_text(tt)

          p = Path('BinSync.Net/src/BinSync.Core/Production/AsyncTransport.cs')
          tt = p.read_text()
          tt = tt.replace('lock (src.Gate)', 'using (src.EnterAllGates())')
          p.write_text(tt)
          print('done')
          PY
      - name: Vendor + test
        run: |
          set -euo pipefail
          bash scripts/vendor-ed25519-from-ztsharp.sh
          cd BinSync.Net
          dotnet test tests/BinSync.Tests -c Release --nologo
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-domain-gates.yml
          git add -A
          git commit -m "feat(node): domain sub-gates Storage/Outbox/Meta + EnterAllGates"
          git push origin HEAD:main
