name: Durable Metadata Bench

on:
  # This is a multi-suite performance run (peer lifecycle, retry, cardinality,
  # ChangeId GC and 1M rows). Start it explicitly at a benchmark milestone.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-peer-lifecycle:
    name: metadata peer lifecycle benchmarks (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Vendor Ed25519 from ZtSharp (MIT subset)
        run: bash scripts/vendor-ed25519-from-ztsharp.sh

      - name: Print benchmark scope
        run: echo "Metadata peer baselines, coordinator retry, cardinality and bounded ChangeId GC"
      - name: Restore benchmark project
        working-directory: BinSync.Net
        run: dotnet restore bench/BinSync.Bench/BinSync.Bench.csproj

      - name: Run durable metadata benchmarks
        working-directory: BinSync.Net
        run: >
          dotnet run --configuration Release
          --project bench/BinSync.Bench
          --
          --filter '*MetadataPeer*'
          --artifacts BenchmarkDotNet.Artifacts

      - name: Run coordinator retry-scan benchmark
        working-directory: BinSync.Net
        run: >
          dotnet run --configuration Release
          --project bench/BinSync.Bench
          --
          --coordinator-retry-only

      - name: Run metadata mutation cardinality benchmark
        working-directory: BinSync.Net
        run: >
          dotnet run --configuration Release
          --project bench/BinSync.Bench
          --
          --metadata-cardinality-only
          --artifacts BenchmarkDotNet.Artifacts/cardinality

      - name: Run bounded ChangeId GC cardinality benchmarks
        working-directory: BinSync.Net
        run: |
          set -o pipefail
          dotnet run --configuration Release \
            --project bench/BinSync.Bench \
            -- --metadata-gc-only 2>&1 | tee metadata-changeid-gc-bench.log
          if grep -F 'NA |' metadata-changeid-gc-bench.log; then
            echo "ChangeId GC benchmark produced a failed/NA case."
            exit 1
          fi

      - name: Run one-million-row metadata freeze benchmark
        working-directory: BinSync.Net
        run: >
          dotnet run --configuration Release
          --project bench/BinSync.Bench
          --
          --metadata-million-only

      - name: Fail if any benchmark case failed
        working-directory: BinSync.Net
        run: |
          mapfile -t reports < <(find BenchmarkDotNet.Artifacts -type f -name '*.md' -print)
          if (("${#reports[@]}" == 0)); then
            echo "No BenchmarkDotNet result reports were produced."
            exit 1
          fi
          million_report="$(find BenchmarkDotNet.Artifacts -type f -name '*MetadataStoreMillionRowBench*-report-github.md' -print -quit)"
          if [[ -z "$million_report" ]]; then
            echo "The one-million-row metadata benchmark did not produce its expected report."
            exit 1
          fi
          if grep -E -n '[|][[:space:]]*NA[[:space:]]*[|]' "${reports[@]}"; then
            echo "One or more metadata benchmark cases failed."
            exit 1
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durable-metadata-benchmarks
          path: |
            BinSync.Net/BenchmarkDotNet.Artifacts
          retention-days: 30
          if-no-files-found: warn
