name: Durable Metadata Bench

on:
  push:
    branches: ["feature/fld-external-storage"]
    paths:
      - "BinSync.Net/bench/**"
      - ".github/workflows/metadata-bench.yml"

permissions:
  contents: read

jobs:
  metadata-peer-lifecycle:
    name: metadata peer lifecycle benchmarks (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Vendor Ed25519 from ZtSharp (MIT subset)
        run: bash scripts/vendor-ed25519-from-ztsharp.sh

      - name: Print benchmark scope
        run: echo "Metadata peer baselines plus coordinator retry after durable freeze"
      - name: Restore benchmark project
        working-directory: BinSync.Net
        run: dotnet restore bench/BinSync.Bench/BinSync.Bench.csproj

      - name: Run durable metadata benchmarks
        working-directory: BinSync.Net
        run: >
          dotnet run --configuration Release
          --project bench/BinSync.Bench
          --
          --filter '*MetadataPeer*'
          --artifacts BenchmarkDotNet.Artifacts

      - name: Run coordinator retry-scan benchmark
        working-directory: BinSync.Net
        run: >
          dotnet run --configuration Release
          --project bench/BinSync.Bench
          --
          --coordinator-retry-only

      - name: Run metadata mutation cardinality benchmark
        working-directory: BinSync.Net
        run: >
          dotnet run --configuration Release
          --project bench/BinSync.Bench
          --
          --metadata-cardinality-only
          --artifacts BenchmarkDotNet.Artifacts/cardinality

      - name: Fail if any benchmark case failed
        working-directory: BinSync.Net
        run: |
          shopt -s nullglob
          reports=(BenchmarkDotNet.Artifacts/results/*.md)
          if (("${#reports[@]}" == 0)); then
            echo "No BenchmarkDotNet result reports were produced."
            exit 1
          fi
          if grep -F -n '| NA |' "${reports[@]}"; then
            echo "One or more metadata benchmark cases failed."
            exit 1
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durable-metadata-benchmarks
          path: |
            BinSync.Net/BenchmarkDotNet.Artifacts
          retention-days: 30
          if-no-files-found: warn
