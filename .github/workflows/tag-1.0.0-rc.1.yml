name: tag-1.0.0-rc.1
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/tag-1.0.0-rc.1.yml]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create annotated tag and prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=v1.0.0-rc.1
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "BinSync.Core 1.0.0-rc.1 — API freeze toward 1.0"
            git push origin "$TAG"
          fi
          # GitHub prerelease
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --title "BinSync.Core 1.0.0-rc.1" --notes-file docs/RELEASE-1.0.0-rc.1.md || true
          fi
          # cleanup this workflow
          git rm -f .github/workflows/tag-1.0.0-rc.1.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "ci: cleanup tag-1.0.0-rc.1 workflow"
            git push origin HEAD:main
          fi
